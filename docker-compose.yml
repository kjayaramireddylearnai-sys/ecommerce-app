version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: postgres-ecommerce-db
    restart: always
    environment:
      POSTGRES_USER: ecommerce_user
      POSTGRES_PASSWORD: ecommerce_pass
      POSTGRES_DB: ecommerce_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce_user -d ecommerce_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: fastapi-ecommerce-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ecommerce_user:ecommerce_pass@db:5432/ecommerce_db
    ports:
      - "8000:8000"

volumes:
  postgres_data:
    driver: local